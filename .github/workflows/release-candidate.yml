name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: Fix
        type: choice
        options: [Major, Minor, Fix]

permissions:
  contents: read

concurrency:
  group: ghostty-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build and release plugin
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      DISPATCH_SHA: ${{ github.sha }}
      BUMP: ${{ inputs.version }}
    steps:
      - name: Require develop
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo '::error::Run Release from develop.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
          dotnet-quality: ga
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            .config/dotnet-tools.json
            global.json
      - name: Prepare release from the dispatched develop commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/release/prepare.py "$BUMP" "$DISPATCH_SHA" > "$RUNNER_TEMP/release.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("version", "tag", "package", "commit", "main_sha"):
                  print(f"{key}={release[key]}", file=output)
          PYTHON
      - name: Shared quality and packaging gate
        run: ./repo check
      - name: Prepare release assets
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PACKAGE"
          mkdir -p artifacts/release
          shasum -a 256 "$PACKAGE" > "artifacts/release/$PACKAGE.sha256"
      - name: Upload validated build
        uses: actions/upload-artifact@v7
        with:
          name: Ghostty-${{ steps.version.outputs.tag }}-macOS
          path: |
            ${{ steps.version.outputs.package }}
            artifacts/release/${{ steps.version.outputs.package }}.sha256
            artifacts/coverage/
          if-no-files-found: error
      - name: Publish validated production HEAD and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          MAIN_SHA: ${{ steps.version.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo '::error::Release checkout changed after validation.'
            exit 1
          fi
          remote_develop="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$remote_develop" = "$DISPATCH_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$MAIN_SHA"
          if [ -n "$MAIN_SHA" ]; then
            git merge-base --is-ancestor "$MAIN_SHA" HEAD
          fi
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" HEAD
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          # No develop push, release/* branch, or PR to main. Never disable protection.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$RELEASE_TAG"
      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.version.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$PACKAGE" "artifacts/release/$PACKAGE.sha256" \
            --verify-tag --generate-notes --title "Ghostty Actions $RELEASE_TAG" --latest
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_id }}
          path: artifacts/coverage/
          if-no-files-found: ignore
